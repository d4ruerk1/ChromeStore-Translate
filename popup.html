<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Translate</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <div class="bar">
    <select id="src" class="lang" data-i18n-aria="sourceLanguage"></select>
    <button id="swap" class="icon" type="button" data-i18n-title="swap" data-i18n-aria="swap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <select id="tgt" class="lang" data-i18n-aria="targetLanguage"></select>
  </div>
  <div class="panes">
    <section class="pane">
      <textarea id="input" dir="auto" spellcheck="true" maxlength="5000" data-i18n-ph="inputPlaceholder" data-i18n-aria="inputPlaceholder"></textarea>
      <div class="tools">
        <span id="count" class="muted">0 / 5000</span>
        <button id="clear" class="icon sm" type="button" data-i18n-title="clear" data-i18n-aria="clear" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </section>
    <section class="pane out">
      <div id="output" dir="auto" role="status" aria-live="polite" tabindex="0" data-i18n-aria="outputLabel"></div>
      <div class="tools">
        <span id="detected" class="muted"></span>
        <button id="copy" class="icon sm" type="button" data-i18n-title="copy" data-i18n-aria="copy" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </section>
  </div>
  <div class="foot">
    <button id="page" class="primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span id="pageLabel" data-i18n="translatePage"></span>
    </button>
    <span id="pageHint" class="muted"></span>
    <a id="privacy" href="#" class="muted link" data-i18n="privacy"></a>
  </div>
  <div id="notice" class="notice" hidden>
    <span data-i18n="privacyNotice"></span>
    <button id="noticeOk" type="button" data-i18n="ok"></button>
  </div>
</main>
<script src="languages.js"></script>
<script src="popup.js"></script>
</body>
</html>
